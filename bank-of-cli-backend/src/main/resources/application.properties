spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.application.name=bank-of-cli-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}

# schema comes only from the init files; Hibernate never issues DDL
spring.jpa.hibernate.ddl-auto=none

# run the init files on every startup (they must be idempotent)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/data.sql

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.persist-authorization=true

spring.main.banner-mode=off
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
